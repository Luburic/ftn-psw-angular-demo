<h2>Misije</h2>

@if (next(); as quest) {
  <p>Sledeća: {{ quest.title }}</p>
} @else {
  <p>Sve misije su završene!</p>
}

<button type="button" (click)="showDone.set(false)">Sve</button>
<button type="button" (click)="showDone.set(true)">Završene</button>

<!-- Kartica ne zna za servis. Spisak joj kaže da li je misija praćena i odlučuje šta njen događaj znači. -->
@for (quest of visible(); track quest.id) {
  <app-quest-card
    [quest]="quest"
    [watched]="watchlist.has(quest.id)"
    (watchedChange)="setWatched(quest, $event)"
  />
} @empty {
  <p>Još nema završenih misija.</p>
}
