<article>
  <!-- Interpolacija: ispisuje vrednost polja. -->
  <h3>{{ title }}</h3>

  <!-- Vezivanje svojstva: [svojstvo]="izraz". -->
  <progress [value]="progress" [max]="goal"></progress>
  {{ progress }} / {{ goal }}

  <!-- Vezivanje događaja: (događaj)="izraz". -->
  <button type="button" [disabled]="progress >= goal" (click)="step()">+1</button>
</article>
