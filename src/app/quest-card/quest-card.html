<article>
  <h3>{{ title }}</h3>

  <!-- Signal se čita pozivom: progress(). Šablon tako postaje njegov čitalac. -->
  <progress [value]="progress()" [max]="goal"></progress>
  {{ progress() }} / {{ goal }}

  <!-- Isti uslov na dva mesta. -->
  <p>{{ progress() >= goal ? 'Završeno!' : 'U toku' }}</p>
  <button type="button" [disabled]="progress() >= goal" (click)="step()">+1</button>
  <button type="button" (click)="reset()">Ispočetka</button>
</article>
