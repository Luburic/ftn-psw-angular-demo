<article>
  <h3>{{ title }}</h3>

  <progress [value]="progress()" [max]="goal"></progress>
  {{ percent() }}%

  <!-- Uslov sada živi na jednom mestu, u klasi. -->
  <p>{{ done() ? 'Završeno!' : 'U toku' }}</p>
  <button type="button" [disabled]="done()" (click)="step()">+1</button>
  <button type="button" (click)="reset()">Ispočetka</button>
</article>
