<header>
  <h1>Misije</h1>
  <nav>
    <a routerLink="/">Početna</a> |
    <a routerLink="/quests">Misije</a>
  </nav>
  <p>
    Praćeno:
    @for (quest of watchlist.quests(); track quest.id) {
      <a [routerLink]="['/quests', quest.id]">{{ quest.title }} {{ percent(quest) }}%</a>
    } @empty {
      ništa
    }
  </p>
</header>
